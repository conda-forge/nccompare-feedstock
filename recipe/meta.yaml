{% set python_min = "3.10.0" %}
{% set name = "nccompare" %}
{% set version = "0.2.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/nccompare-{{ version }}.tar.gz
  sha256: 75aabe4d2ec010ecd9da273181e1b84b1012ceb882a1c6975df13787ca7f95c6

build:
  entry_points:
    - ncpare = nccompare.management:start_from_command_line_interface
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }},<4.0.0
    - xarray >=2024.6.0,<2025.0.0
    - pandas >=2.2.2,<3.0.0
    - netcdf4 >=1.7.1,<2.0.0
    - rich >=13.7.1,<14.0.0

test:
  imports:
    - nccompare
  commands:
    - pip check
    - ncpare --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/nccompare/
  summary: netCDF Comparison Tool
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - anto6715
